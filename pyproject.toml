[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repogc"
version = "0.0.0"
description = "Evidence-first repository review. Investigate before changing it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/cooleryu/RepoGc"
Issues = "https://github.com/cooleryu/RepoGc/issues"

[project.scripts]
repogc = "repogc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
