[scan]
include_suffixes = [".md", ".txt", ".py", ".js", ".mjs", ".cjs", ".ts", ".tsx", ".jsx", ".toml", ".json", ".jsonl", ".yaml", ".yml", ".sh"]
orphan_suffixes = [".md"]
duplicate_suffixes = [".md", ".txt"]
exclude_dirs = [".git", ".venv", "__pycache__", "build", "dist", "node_modules", "vendor", ".tmp", ".brb", "docs/gc_reports", "reference/gc_reports"]
exclude_globs = ["**/*.egg-info/**"]
root_files = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "SECURITY.md"]
max_file_bytes = 1000000
duplicate_threshold = 0.96
duplicate_min_chars = 120
use_git = true

[markers]
tokens = ["TODO", "FIXME", "XXX", "NOT_IMPLEMENTED", "未实现", "待实现"]

[graph]
root_globs = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "SECURITY.md", ".agents/skills/**/SKILL.md"]
instruction_globs = ["AGENTS.md", "**/AGENTS.md", "CLAUDE.md", "**/CLAUDE.md", "**/SKILL.md"]
contract_globs = ["**/SKILL.md"]
test_globs = ["test/**", "tests/**", "**/fixtures/**"]
generated_globs = ["docs/gc_reports/**", "reference/gc_reports/**", "**/runs/**"]
ci_globs = [".github/workflows/**", ".gitlab-ci.yml"]
config_globs = ["package.json", "pyproject.toml", "Cargo.toml", "repogc.toml"]
config_reference_keys = ["main", "module", "browser", "types", "bin", "exports", "scripts"]
state_reference_keys = ["artifacts"]

[reports]
markdown = "docs/gc_reports/latest.md"
json = "docs/gc_reports/latest.json"
baseline = "reference/gc_reports/baseline.json"
